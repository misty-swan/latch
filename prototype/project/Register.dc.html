<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LATCH 表示名と生年月日</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./latch.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;family=Shippori+Mincho:wght@400;500;600&amp;family=Zen+Kaku+Gothic+New:wght@300;400;500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="screen" data-theme="{{theme}}" style="width: 390px; height: 844px"><svg class="grain" aria-hidden="true"><defs><filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .10  0 0 0 0 .13  0 0 0 0 .20  1.9 0 0 0 -.86"></feColorMatrix></filter><filter id="grain-d" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .92  0 0 0 0 .94  0 0 0 0 1  1.9 0 0 0 -.86"></feColorMatrix></filter></defs><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
<header class="topbar"><div class="topbar__side"><a class="icon-btn" href="SignIn.dc.html" aria-label="戻る"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></a></div><span></span><div class="topbar__side topbar__side--end"><span class="t-meta" style="padding-right:14px">1 / 2</span></div></header>
<div class="screen__body pad" style="padding-top:12px">
<h1 class="t-display t-display--s">あなたのことを、少しだけ。</h1>
<div class="stack" style="gap:28px;margin-top:30px">
<div class="field">
<label class="field__label" for="r-name">表示名</label>
<input class="input" id="r-name" maxlength="40" autocomplete="nickname" placeholder="例: みなと" value="みなと">
<p class="field__help">つながった相手にだけ表示されます。あとから変えられます。</p>
</div>
<div class="field">
<label class="field__label" for="r-birth">生年月日</label>
<input class="input" id="r-birth" type="date" value="1997-05-14" max="2026-10-16">
<p class="field__help">年齢の確認にだけ使います。誰にも表示されません。</p>
</div>
</div>
</div>
<div class="screen__foot"><a class="btn btn--primary btn--block" href="Consent.dc.html">次へ</a></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
