<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LATCH 通報する</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./latch.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;family=Shippori+Mincho:wght@400;500;600&amp;family=Zen+Kaku+Gothic+New:wght@300;400;500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="screen report" data-theme="{{theme}}" style="width: 390px; height: 898px"><svg class="grain" aria-hidden="true"><defs><filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .10  0 0 0 0 .13  0 0 0 0 .20  1.9 0 0 0 -.86"></feColorMatrix></filter><filter id="grain-d" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .92  0 0 0 0 .94  0 0 0 0 1  1.9 0 0 0 -.86"></feColorMatrix></filter></defs><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
<header class="topbar"><div class="topbar__side"><a class="icon-btn" href="Chat.dc.html" aria-label="やめる"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></a></div><div class="topbar__title">通報する</div><div class="topbar__side topbar__side--end"></div></header>
<div class="screen__body pad" style="padding-top:8px;padding-bottom:24px">
<p class="t-body">通報したことは、相手には通知されません。運営が内容を確かめ、5営業日以内に対応します。</p>
<h2 class="t-label" style="margin-top:26px">対象</h2>
<div style="margin-top:8px"><label class="radio-row"><input type="radio" name="target"><span>プロフィール(表示名・ひとこと)</span></label><label class="radio-row"><input type="radio" name="target"><span>アイコン</span></label><label class="radio-row"><input type="radio" name="target" checked=""><span>メッセージ</span></label></div>
<h2 class="t-label" style="margin-top:26px">理由</h2>
<div style="margin-top:8px"><label class="radio-row"><input type="radio" name="why" checked=""><span>スパム・勧誘</span></label><label class="radio-row"><input type="radio" name="why"><span>嫌がらせ</span></label><label class="radio-row"><input type="radio" name="why"><span>不適切な内容</span></label><label class="radio-row"><input type="radio" name="why"><span>その他</span></label></div>
<div class="field" style="margin-top:26px">
<label class="field__label" for="rp-more">くわしく<span style="font-weight:400;color:var(--ink-3);margin-left:6px">任意</span></label>
<textarea class="input" id="rp-more" rows="3" maxlength="500"></textarea>
</div>
</div>
<div class="screen__foot"><a class="btn btn--primary btn--block" href="Chat.dc.html">通報する</a></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":898}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
