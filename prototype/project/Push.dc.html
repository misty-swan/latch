<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LATCH プッシュ通知</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./latch.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;family=Shippori+Mincho:wght@400;500;600&amp;family=Zen+Kaku+Gothic+New:wght@300;400;500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="screen push-mock" data-theme="{{theme}}" style="width: 390px; height: 844px"><svg class="grain" aria-hidden="true"><defs><filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .10  0 0 0 0 .13  0 0 0 0 .20  1.9 0 0 0 -.86"></feColorMatrix></filter><filter id="grain-d" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .92  0 0 0 0 .94  0 0 0 0 1  1.9 0 0 0 -.86"></feColorMatrix></filter></defs><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
<div class="push-mock__wall" aria-hidden="true"><div style="position:absolute;left:50%;top:520px;transform:translateX(-50%)"><div class="latch is-arrived" style="--size:300px;--gap:26px;filter:blur(1px);opacity:.9" aria-hidden="true"><span class="latch__light"></span><span class="latch__mine"></span><span class="latch__theirs"><span class="latch__ink"></span></span></div></div></div>
<div class="screen__body" style="padding:96px 12px 0;display:flex;flex-direction:column;gap:10px">
<p class="t-eyebrow" style="padding:0 12px 8px">通知の見え方</p>
<div class="os-push" role="img" aria-label="通知: LATCH候補があります。詳細はアプリでご確認ください。"><span class="os-push__icon"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path class="mark__mine" d="M11.1 3.2a8.8 8.8 0 0 0 0 17.6z"></path><path class="mark__theirs" d="M12.9 3.2a8.8 8.8 0 0 1 0 17.6z"></path></svg></span><span><span class="os-push__top"><span class="os-push__app">LATCH</span><span>いま</span></span><span class="os-push__body">LATCH候補があります。詳細はアプリでご確認ください。</span></span></div>
<div class="os-push" role="img" aria-label="通知: つながりが成立しました。詳細はアプリでご確認ください。"><span class="os-push__icon"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path class="mark__mine" d="M11.1 3.2a8.8 8.8 0 0 0 0 17.6z"></path><path class="mark__theirs" d="M12.9 3.2a8.8 8.8 0 0 1 0 17.6z"></path></svg></span><span><span class="os-push__top"><span class="os-push__app">LATCH</span><span>3日前</span></span><span class="os-push__body">つながりが成立しました。詳細はアプリでご確認ください。</span></span></div>
<p class="t-caption" style="padding:18px 14px 0">通知の本文は、いつも同じ汎用文です。意思の内容や相手のことは、ロック画面にも通知の履歴にも載りません。</p>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
