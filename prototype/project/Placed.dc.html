<x-dc>
<helmet>

<style>body{margin:0}</style>
</helmet>
<div class="screen placed" data-theme="{{theme}}" style="width: 390px; height: 844px"><svg class="grain" aria-hidden="true"><defs><filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .10  0 0 0 0 .13  0 0 0 0 .20  1.9 0 0 0 -.86"></feColorMatrix></filter><filter id="grain-d" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .92  0 0 0 0 .94  0 0 0 0 1  1.9 0 0 0 -.86"></feColorMatrix></filter></defs><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
<div class="screen__body" style="display:flex;flex-direction:column">
<div style="position:relative;height:388px;flex:none">
<p class="placed__words t-words" aria-hidden="true">イラストを描く人と、月1くらいで雑に絵を見せ合える関係になれたら嬉しい。初心者です。</p>
<div class="placed__art" style="position:absolute;left:28px;top:118px"><div class="latch is-waiting" style="--size:196px;--gap:18px;" aria-hidden="true"><span class="latch__light"></span><span class="latch__mine"></span><span class="latch__theirs"><span class="latch__ink"></span></span></div></div>
<p class="tategaki reveal reveal--late" style="position:absolute;right:36px;top:92px;font-size:30px" aria-label="預けました。"><span aria-hidden="true"><span class="ch" style="--i:0">預</span><span class="ch" style="--i:1">け</span><span class="ch" style="--i:2">ま</span><span class="ch" style="--i:3">し</span><span class="ch" style="--i:4">た</span><span class="ch" style="--i:5">。</span></span></p>
</div>
<div class="pad">
<p class="t-title rise rise-4">あとは、待つだけ。</p>
<p class="t-body rise rise-5" style="margin-top:8px">合う相手が現れたときだけ、お知らせします。届かない日も、意思はここに置かれています。</p>
</div>
<div class="push-ask rise rise-5">
<p class="row t-head" style="gap:10px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 16.5v-5.2a5.5 5.5 0 0 1 11 0v5.2l1.6 1.9H4.9z"></path><path d="M10 20.6a2.1 2.1 0 0 0 4 0"></path></svg>届いたとき、通知でお知らせしましょうか。</p>
<p class="t-caption" style="margin-top:4px">通知には、意思の内容も相手のことも表示されません。</p>
<div class="row" style="gap:8px;margin-top:12px">
<a class="btn btn--primary btn--small" href="Home.dc.html">通知を受け取る</a>
<a class="btn btn--quiet btn--small" href="Home.dc.html">あとで</a>
</div>
</div>
</div>
<div class="screen__foot"><a class="btn btn--secondary btn--block" href="Home.dc.html">預けている一覧へ</a></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
