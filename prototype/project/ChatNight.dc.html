<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LATCH チャット 夜</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./latch.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;family=Shippori+Mincho:wght@400;500;600&amp;family=Zen+Kaku+Gothic+New:wght@300;400;500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="screen chat-screen" data-theme="{{theme}}" style="width: 390px; height: 844px"><svg class="grain" aria-hidden="true"><defs><filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .10  0 0 0 0 .13  0 0 0 0 .20  1.9 0 0 0 -.86"></feColorMatrix></filter><filter id="grain-d" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .92  0 0 0 0 .94  0 0 0 0 1  1.9 0 0 0 -.86"></feColorMatrix></filter></defs><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
<header class="topbar"><div class="topbar__side"><a class="icon-btn" href="Connections.dc.html" aria-label="戻る"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"></path></svg></a></div><div class="topbar__title"><div class="chat-head"><span class="avatar avatar--b avatar--s" aria-hidden="true"></span><div class="stack" style="min-width:0"><p class="chat-head__name">ひなた</p><p class="chat-head__sub">イラスト仲間<span class="sep">·</span>つながり</p></div></div></div><div class="topbar__side topbar__side--end"><a class="icon-btn" href="ChatMenu.dc.html" aria-label="このつながりについて"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.25" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.25" fill="currentColor" stroke="none"></circle><circle cx="18.5" cy="12" r="1.25" fill="currentColor" stroke="none"></circle></svg></a></div></header>
<div class="screen__body" style="display:flex;flex-direction:column;justify-content:flex-end">
<div class="chat">
<div class="chat__origin">
<div class="latch is-latched" style="--size:30px;--gap:0px;--theirs-fill:#6B4E2E" aria-hidden="true"><span class="latch__light"></span><span class="latch__mine"></span><span class="latch__theirs"><span class="latch__ink"></span></span></div>
<p class="t-meta">10月16日 18:19 につながりました</p>
<p class="t-caption">イラスト仲間<span class="sep">·</span>2人</p>
</div>
<p class="chat__day t-meta">今日</p><div class="msg msg--theirs"><p class="msg__bubble">はじめまして、ひなたです。参加してくださってありがとうございます。</p><span class="msg__time">18:24</span></div><div class="msg msg--theirs"><p class="msg__bubble">わたしも初心者なので、気軽に見せ合えたら嬉しいです。</p><span class="msg__time">18:24</span></div><div class="msg msg--mine"><p class="msg__bubble">こちらこそ、よろしくお願いします。夜に少しずつ描いています。</p><span class="msg__time">21:40</span></div><div class="msg msg--theirs"><p class="msg__bubble">夜に描く絵、いいですね。月末に1枚ずつ見せ合いませんか。</p><span class="msg__time">21:52</span></div>
</div>
</div>
<form class="composer">
<label class="sr-only" for="m-text">メッセージ</label>
<textarea class="composer__field" id="m-text" rows="1" maxlength="1000" placeholder="メッセージ"></textarea>
<button class="composer__send" type="submit" aria-label="送る" disabled=""><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5V6M6.8 11L12 5.8 17.2 11"></path></svg></button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
