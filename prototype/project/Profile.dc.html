<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LATCH プロフィール</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./latch.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&amp;family=Shippori+Mincho:wght@400;500;600&amp;family=Zen+Kaku+Gothic+New:wght@300;400;500;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="screen profile" data-theme="{{theme}}" style="width: 390px; height: 844px"><svg class="grain" aria-hidden="true"><defs><filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .10  0 0 0 0 .13  0 0 0 0 .20  1.9 0 0 0 -.86"></feColorMatrix></filter><filter id="grain-d" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .92  0 0 0 0 .94  0 0 0 0 1  1.9 0 0 0 -.86"></feColorMatrix></filter></defs><rect width="100%" height="100%" filter="url(#grain)"></rect></svg>
<header class="topbar"><div class="topbar__side"><a class="icon-btn" href="Me.dc.html" aria-label="やめる"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></a></div><div class="topbar__title">プロフィール</div><div class="topbar__side topbar__side--end"><a class="btn btn--quiet btn--small" href="Me.dc.html" style="color:var(--ink)">保存</a></div></header>
<div class="screen__body pad" style="padding-top:12px;padding-bottom:28px">
<div class="row" style="gap:18px">
<span class="avatar avatar--a avatar--xl" role="img" aria-label="あなたのアイコン"></span>
<div class="stack" style="gap:6px">
<button class="btn btn--secondary btn--small" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="3"></rect><circle cx="9.3" cy="10" r="1.6"></circle><path d="M5 17.5l4.2-3.8 3.2 2.6 2.8-2.4 3.8 3.4"></path></svg>画像を選ぶ</button>
<button class="btn btn--quiet btn--small" type="button" style="justify-content:flex-start;padding-left:4px">既定のアイコンに戻す</button>
</div>
</div>
<p class="t-caption" style="margin-top:10px">PNG・JPEG・WebP、1MBまで。未設定のときは、この模様が表示されます。</p>
<div class="stack" style="gap:28px;margin-top:30px">
<div class="field">
<div class="row" style="justify-content:space-between"><label class="field__label" for="p-name">表示名</label><span class="counter"><b>3</b> / 40</span></div>
<input class="input" id="p-name" maxlength="40" value="みなと">
</div>
<div class="field">
<div class="row" style="justify-content:space-between"><label class="field__label" for="p-bio">ひとこと<span style="font-weight:400;color:var(--ink-3);margin-left:6px">任意</span></label><span class="counter"><b>19</b> / 200</span></div>
<textarea class="input" id="p-bio" rows="4" maxlength="200" style="font-family:var(--f-mincho);font-weight:500;font-size:16px" placeholder="例: 夜に散歩しながら、写真を撮っています。">夜に散歩しながら、写真を撮っています。</textarea>
<p class="field__help">つながった相手にだけ表示されます。年齢・性別・所在地を書く欄はありません。</p>
</div>
</div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
