<div class="screen__body pad" style="padding-top:4px;padding-bottom:24px">
<h1 class="t-display t-display--s">こう読み解きました。</h1>
<div class="row" style="gap:12px;margin-top:16px;align-items:flex-start">
<p class="quote clamp-2" style="flex:1">今夜20時以降、天文館あたりで2〜4人、5,000円以内で軽く飲みに行きたい。</p>
<a class="btn btn--quiet btn--small" style="margin:-6px -12px 0 0" href="Compose.dc.html">文章を直す</a>
</div>
<section style="margin-top:28px">
<h2 class="t-label">預け方</h2>
<div class="choice" role="radiogroup" aria-label="預け方" style="margin-top:12px">
<label class="choice__opt"><input type="radio" name="form" value="connection"><span class="choice__card"><svg class="glyph" viewBox="0 0 20 20" aria-hidden="true"><path class="gt" d="M10.9 1.5A8.5 8.5 0 0 1 10.9 18.5"></path><path class="gm" d="M9.1 1.5A8.5 8.5 0 0 0 9.1 18.5Z"></path></svg><span class="choice__name">つながりとして預ける</span><span class="choice__hint">すぐ会う予定はない</span></span></label>
<label class="choice__opt"><input type="radio" name="form" value="occasion" checked=""><span class="choice__card"><svg class="glyph" viewBox="0 0 20 20" aria-hidden="true"><path class="gl" d="M11.3 1.5A8.5 8.5 0 0 1 11.3 18.5Z"></path><path class="gm" d="M8.7 1.5A8.5 8.5 0 0 0 8.7 18.5Z"></path></svg><span class="choice__name">機会として預ける</span><span class="choice__hint">日時がある</span></span></label>
</div>
</section>
<section style="margin-top:30px">
<h2 class="t-label">読み解いた条件</h2>
<dl class="facts" style="margin-top:8px"><div class="fact"><dt class="fact__key">主題</dt><dd class="fact__val">軽く飲みに行く</dd><button class="icon-btn" type="button" aria-label="主題を直す"><svg class="ic ic--s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h3.6L18.3 9.3a2 2 0 0 0 0-2.8l-.8-.8a2 2 0 0 0-2.8 0L5 15.4z"></path><path d="M13.4 7l3.6 3.6"></path></svg></button></div><div class="fact"><dt class="fact__key">日時</dt><dd class="fact__val">今日 20:00〜</dd><button class="icon-btn" type="button" aria-label="日時を直す"><svg class="ic ic--s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h3.6L18.3 9.3a2 2 0 0 0 0-2.8l-.8-.8a2 2 0 0 0-2.8 0L5 15.4z"></path><path d="M13.4 7l3.6 3.6"></path></svg></button></div><div class="fact"><dt class="fact__key">場所</dt><dd class="fact__val">天文館周辺</dd><button class="icon-btn" type="button" aria-label="場所を直す"><svg class="ic ic--s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h3.6L18.3 9.3a2 2 0 0 0 0-2.8l-.8-.8a2 2 0 0 0-2.8 0L5 15.4z"></path><path d="M13.4 7l3.6 3.6"></path></svg></button></div><div class="fact"><dt class="fact__key">人数</dt><dd class="fact__val">2〜4人</dd><button class="icon-btn" type="button" aria-label="人数を直す"><svg class="ic ic--s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h3.6L18.3 9.3a2 2 0 0 0 0-2.8l-.8-.8a2 2 0 0 0-2.8 0L5 15.4z"></path><path d="M13.4 7l3.6 3.6"></path></svg></button></div><div class="fact"><dt class="fact__key">予算</dt><dd class="fact__val">5,000円以内</dd><button class="icon-btn" type="button" aria-label="予算を直す"><svg class="ic ic--s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h3.6L18.3 9.3a2 2 0 0 0 0-2.8l-.8-.8a2 2 0 0 0-2.8 0L5 15.4z"></path><path d="M13.4 7l3.6 3.6"></path></svg></button></div><div class="fact"><dt class="fact__key">お酒</dt><dd class="fact__val">含む<span class="fact__sub">20歳以上の方どうしでだけ届きます。</span></dd><div class="switch"><input type="checkbox" aria-label="お酒を含む" checked=""><span></span></div></div></dl>
</section>
<section style="margin-top:30px">
<h2 class="t-label">期限</h2>
<div style="margin-top:12px"><p class="t-body" style="color:var(--ink)">開始から3時間後(今日 23:00)まで</p><p class="t-caption" style="margin-top:4px">機会の期限は、日時から自動で決まります。</p></div>
</section>
<p class="privacy" style="margin-top:28px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.4"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"></path></svg>文章そのものは、相手にも表示されません。</p>
</div>

<a class="btn btn--primary btn--block" href="Placed.dc.html">預ける</a>
</div>
