<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LATCH プロトタイプ</title>
<meta name="description" content="繋がりたいことを、置いておけばいい。LATCHのUIプロトタイプ。">
<meta name="theme-color" content="#EEF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1420" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="app/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="project/latch.css">
<link rel="stylesheet" href="app/shell.css">
</head>
<body>

<!-- アイコンと質感フィルタ(全画面で共有) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .10  0 0 0 0 .13  0 0 0 0 .20  1.9 0 0 0 -.86"/>
    </filter>
    <filter id="grain-d" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .92  0 0 0 0 .94  0 0 0 0 1  1.9 0 0 0 -.86"/>
    </filter>
    <filter id="bleed" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="deboss" x="-10%" y="-10%" width="120%" height="120%">
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="2.4" result="b1"/>
      <feOffset in="b1" dx="2.6" dy="2.6" result="o1"/>
      <feFlood flood-color="#161E30" flood-opacity=".2"/>
      <feComposite in2="o1" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="sh"/>
      <feGaussianBlur in="inv" stdDeviation="2" result="b2"/>
      <feOffset in="b2" dx="-2.2" dy="-2.2" result="o2"/>
      <feFlood flood-color="#FFFFFF" flood-opacity=".95"/>
      <feComposite in2="o2" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="hl"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/><feMergeNode in="hl"/></feMerge>
    </filter>
    <filter id="deboss-d" x="-10%" y="-10%" width="120%" height="120%">
      <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="2.6" result="b1"/>
      <feOffset in="b1" dx="2.6" dy="2.6" result="o1"/>
      <feFlood flood-color="#000000" flood-opacity=".6"/>
      <feComposite in2="o1" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="sh"/>
      <feGaussianBlur in="inv" stdDeviation="1.6" result="b2"/>
      <feOffset in="b2" dx="-1.6" dy="-1.6" result="o2"/>
      <feFlood flood-color="#FFFFFF" flood-opacity=".045"/>
      <feComposite in2="o2" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="hl"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/><feMergeNode in="hl"/></feMerge>
    </filter>

    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.25" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.25" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.25" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6.5 16.5v-5.2a5.5 5.5 0 0 1 11 0v5.2l1.6 1.9H4.9z"/><path d="M10 20.6a2.1 2.1 0 0 0 4 0"/></symbol>
    <symbol id="i-bell-off" viewBox="0 0 24 24"><path d="M8.4 6.9a5.5 5.5 0 0 1 9.1 4.4v5.2l1.6 1.9H9.6"/><path d="M6.5 11.3v5.2l-1.6 1.9H15"/><path d="M10 20.6a2.1 2.1 0 0 0 4 0"/><path d="M4 4l16 16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 18.5V6M6.8 11L12 5.8 17.2 11"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M5 19h3.6L18.3 9.3a2 2 0 0 0 0-2.8l-.8-.8a2 2 0 0 0-2.8 0L5 15.4z"/><path d="M13.4 7l3.6 3.6"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6.5v11M15 6.5v11"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 6.2v11.6l9.2-5.8z"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14.5L4.5 10 9 5.5"/><path d="M4.5 10H14a5.5 5.5 0 0 1 0 11h-2.5"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.6 4.6L19 7.6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2"/><circle cx="12" cy="7.9" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M4 4l16 16"/><path d="M8.6 15.9a4.8 4.8 0 0 1 5.6-.6"/><path d="M5.2 12.4a9.6 9.6 0 0 1 3.6-2.3M12.4 9.3a9.6 9.6 0 0 1 6.4 3.1"/><path d="M2.4 9.2a14 14 0 0 1 3.1-2.3M10 5.6a14 14 0 0 1 11.6 3.6"/><circle cx="12" cy="19" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 20.5V4.5"/><path d="M6 5h11.2l-2.2 4 2.2 4H6"/></symbol>
    <symbol id="i-block" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M6 18L18 6"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M14 4.5h4.5v15H14"/><path d="M10 8l-4 4 4 4M6 12h9.5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.6" r="3.6"/><path d="M5 19.5a7 7 0 0 1 14 0"/></symbol>
    <symbol id="i-half" viewBox="0 0 24 24"><path d="M11.2 3.8a8.2 8.2 0 0 0 0 16.4z" fill="currentColor"/><path d="M13.2 3.9a8.2 8.2 0 0 1 0 16.2" stroke-dasharray="2.2 2.4"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><path d="M3.5 18.5a5.5 5.5 0 0 1 11 0"/><path d="M15.2 6.3a3 3 0 0 1 0 5.4M17 13.6a5.5 5.5 0 0 1 3.5 4.9"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 20.5s6-5.4 6-10.2a6 6 0 0 0-12 0c0 4.8 6 10.2 6 10.2z"/><circle cx="12" cy="10.3" r="2.1"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4.5" y="5.5" width="15" height="14" rx="2.5"/><path d="M4.5 9.8h15M8.5 3.8v3.4M15.5 3.8v3.4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.4"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.2-5.1"/><path d="M19.2 4.6v3.6h-3.6"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><circle cx="9.3" cy="10" r="1.6"/><path d="M5 17.5l4.2-3.8 3.2 2.6 2.8-2.4 3.8 3.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.2A7.6 7.6 0 0 1 9.8 4.5a7.6 7.6 0 1 0 9.7 9.7z"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.6a2.4 2.4 0 1 1 3.4 2.2c-.7.3-1.1.9-1.1 1.7v.4"/><circle cx="12" cy="16.9" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3.8h7l4 4v12.4H7z"/><path d="M14 3.8v4h4M9.8 12.5h5.4M9.8 15.8h5.4"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5a4 4 0 0 1-.6-8 5.5 5.5 0 0 1 10.6 1.4 3.4 3.4 0 0 1-.5 6.6z"/></symbol>
    <symbol id="i-yen" viewBox="0 0 24 24"><path d="M7 5l5 7 5-7M12 12v7.5M8.2 13h7.6M8.2 16.2h7.6"/></symbol>
    <symbol id="i-glass" viewBox="0 0 24 24"><path d="M7 4.5h10l-1 6.5a4 4 0 0 1-8 0z"/><path d="M12 15v5M8.8 20h6.4"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4.5 12.3V5.5a1 1 0 0 1 1-1h6.8l7.2 7.2a1.4 1.4 0 0 1 0 2l-5.8 5.8a1.4 1.4 0 0 1-2 0z"/><circle cx="8.6" cy="8.6" r="1.3"/></symbol>
    <symbol id="i-google" viewBox="0 0 24 24"><path d="M19.6 12.2c0-.6-.1-1.1-.2-1.6H12v3.1h4.3a3.7 3.7 0 0 1-1.6 2.4v2h2.6c1.5-1.4 2.3-3.4 2.3-5.9z"/><path d="M12 20c2.2 0 4-.7 5.3-1.9l-2.6-2a4.8 4.8 0 0 1-7.2-2.5H4.8v2.1A8 8 0 0 0 12 20z"/><path d="M7.5 13.6a4.8 4.8 0 0 1 0-3.2V8.3H4.8a8 8 0 0 0 0 7.4z"/><path d="M12 7.2c1.2 0 2.3.4 3.2 1.2l2.3-2.3A8 8 0 0 0 4.8 8.3l2.7 2.1A4.8 4.8 0 0 1 12 7.2z"/></symbol>
    <symbol id="i-apple" viewBox="0 0 24 24"><path d="M15.6 12.6c0-2 1.6-2.9 1.7-3a3.7 3.7 0 0 0-2.9-1.6c-1.2-.1-2.4.7-3 .7s-1.6-.7-2.6-.7a3.9 3.9 0 0 0-3.3 2c-1.4 2.5-.4 6.1 1 8.1.7 1 1.5 2 2.5 2s1.4-.6 2.6-.6 1.5.6 2.6.6 1.7-1 2.4-2a8 8 0 0 0 1.1-2.2 3.4 3.4 0 0 1-2.1-3.3z"/><path d="M13.8 6.4a3.4 3.4 0 0 0 .8-2.5 3.6 3.6 0 0 0-2.3 1.2 3.3 3.3 0 0 0-.8 2.4 3 3 0 0 0 2.3-1.1z"/></symbol>
  </defs>
</svg>

<div class="stage">
  <div class="device" id="device">
    <div id="app" class="app-host" aria-live="polite"></div>
    <div id="os-layer" class="os-layer" aria-live="assertive"></div>
  </div>

  <aside class="demo" id="demo" aria-label="プロトタイプの操作">
    <button class="demo__toggle" id="demo-toggle" type="button" aria-expanded="false" aria-controls="demo-panel">デモ操作</button>
    <div class="demo__panel" id="demo-panel">
      <header class="demo__head">
        <p class="demo__eyebrow">LATCH / PROTOTYPE</p>
        <h2 class="demo__title">プロトタイプの操作</h2>
        <p class="demo__lead">画面はそのまま触れます。相手の動きなど、ひとりでは起こせない出来事はここから起こします。</p>
      </header>

      <section class="demo__sec">
        <h3>出来事を起こす</h3>
        <div class="demo__grid">
          <button type="button" data-sim="propose-connection">提案を届ける<small>つながり・1対1</small></button>
          <button type="button" data-sim="propose-group">提案を届ける<small>機会・4人</small></button>
          <button type="button" data-sim="partner-yes">相手も参加する<small>成立させる</small></button>
          <button type="button" data-sim="partner-defer">相手が見送る<small>不成立</small></button>
          <button type="button" data-sim="partner-leave">相手が離脱する<small>つながり終了</small></button>
          <button type="button" data-sim="expire-intent">意思の期限切れ<small>お知らせ</small></button>
        </div>
      </section>

      <section class="demo__sec">
        <h3>環境</h3>
        <div class="demo__seg" role="group" aria-label="表示">
          <span>表示</span>
          <button type="button" data-env="theme:auto">端末</button>
          <button type="button" data-env="theme:light">昼</button>
          <button type="button" data-env="theme:dark">夜</button>
        </div>
        <div class="demo__seg" role="group" aria-label="通知の許可">
          <span>通知</span>
          <button type="button" data-env="push:granted">許可</button>
          <button type="button" data-env="push:default">未設定</button>
          <button type="button" data-env="push:denied">拒否</button>
        </div>
        <div class="demo__seg" role="group" aria-label="接続">
          <span>接続</span>
          <button type="button" data-env="net:online">オンライン</button>
          <button type="button" data-env="net:offline">オフライン</button>
        </div>
      </section>

      <section class="demo__sec">
        <h3>画面へ移動</h3>
        <nav class="demo__nav" id="demo-nav"></nav>
      </section>

      <footer class="demo__foot">
        <button type="button" data-sim="reset">最初からやり直す</button>
      </footer>
    </div>
  </aside>
</div>

<script src="app/app.js"></script>
</body>
</html>
