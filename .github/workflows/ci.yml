name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    # 試験が止まったときに既定の6時間まで待たない(普段は約7分・2026-10-25に約3時間40分止まった前例)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # versionはpackage.jsonのpackageManagerフィールドから自動参照
      - uses: actions/setup-node@v5
        with:
          # react-router 8.4.0がnode>=22.22.0を要求する(F2'計画Task 1の申し送り)。
          # メジャー指定(22)では要求を満たさない版に当たる可能性があるため明示版に固定する
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # worker E2Eの前にwebのビルド生成物(apps/web/dist)を用意する。
      # wrangler.jsoncのassets.directory=../web/distが存在しないとwrangler devが起動しない
      - run: pnpm --filter web build
      # F1ゲート: 認証E2E・テスト鍵起動ガード(既定ポート8787)
      - run: pnpm --filter worker test:e2e

  # 画面フローのブラウザE2E(F2'計画Task 8)。worker E2Eとは別ジョブで、
  # 既定ポートも分離している(web=8788・worker=8787・LATCH_E2E_PORTで上書き可)
  web-e2e:
    runs-on: ubuntu-latest
    # 普段は約2〜3分(chromiumの取得を含む)。止まったときの損失を抑える
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # chromiumのみインストールする(worker E2EはAPIレベルでブラウザ不要・CIはAPIレベル専用)
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # webServerが「VITE_DEV_AUTH=1でのvite build→.dev.vars生成→D1マイグレーション→
      # wrangler dev(8788)」まで自動で行う(詳細はapps/web/playwright.config.ts)
      - run: pnpm --filter web test:e2e

  # mainへのpushでstagingへ自動デプロイする(F8b設計 §2・docs/04 §6・docs/runbooks/staging.md 4〜5章)。
  # シークレットの登録前に赤くならないよう、リポジトリ変数STAGING_DEPLOY_ENABLEDが
  # 'true'のときだけ動く。手順はscripts/deploy-staging.mjsと同じで、どこで落ちたかを
  # 記録で分かるよう1手順ずつ別のstepにしている。URLはシークレットなので記録に残らない。
  # シークレットはjob全体には置かず、使うstepだけに渡す(pnpm installの依存の処理や
  # 他者のactionへトークンを見せない)。wranglerの出力はrun-redacted.mjsでURLを伏せる
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: [ci, web-e2e]
    runs-on: ubuntu-latest
    # 同時に2本は動かさず、後から来たものは前のものの終わりを待つ(途中の実行は止めない)
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # テスト用サインインの画面を出すため VITE_DEV_AUTH=1 でビルドする
      - run: pnpm --filter web build
        env:
          VITE_DEV_AUTH: "1"
      - run: node apps/worker/scripts/run-redacted.mjs pnpm --filter worker exec wrangler d1 migrations apply DB --env staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node apps/worker/scripts/run-redacted.mjs pnpm --filter worker exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node apps/worker/scripts/staging-smoke.mjs
        env:
          LATCH_STAGING_URL: ${{ secrets.LATCH_STAGING_URL }}
          LATCH_ACCESS_CLIENT_ID: ${{ secrets.LATCH_ACCESS_CLIENT_ID }}
          LATCH_ACCESS_CLIENT_SECRET: ${{ secrets.LATCH_ACCESS_CLIENT_SECRET }}
